<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%">
  <defs>
    <!-- Gradient for the glowing connection line -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#A3DA00" />
    </linearGradient>
    
    <!-- Glow filter for the traveling energy ball -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="800" height="250" rx="15" fill="#0D1117"/>

  <!-- Top Title Text -->
  <text x="400" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="3">DAA ALGORITHM PIPELINE</text>

  <!-- Base Static Path (The Track) -->
  <path d="M 200 130 C 350 40, 450 220, 600 130" fill="none" stroke="#30363D" stroke-width="6" stroke-linecap="round"/>

  <!-- The Animated Flowing Dashed Line -->
  <path d="M 200 130 C 350 40, 450 220, 600 130" fill="none" stroke="url(#lineGrad)" stroke-width="6" stroke-dasharray="15 15" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1s" repeatCount="indefinite" />
  </path>

  <!-- The Glowing Energy Ball Traveling Along the Path -->
  <circle r="6" fill="#FFFFFF" filter="url(#glow)">
    <animateMotion path="M 200 130 C 350 40, 450 220, 600 130" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- ========================================== -->
  <!-- LAB 01 NODE (Left Side)                    -->
  <!-- ========================================== -->
  
  <!-- Outer Rotating Dashed Ring -->
  <circle cx="200" cy="130" r="55" fill="none" stroke="#00F0FF" stroke-width="3" stroke-dasharray="25 15" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 200 130" to="360 200 130" dur="6s" repeatCount="indefinite" />
  </circle>
  
  <!-- Inner Pulsing Ring -->
  <circle cx="200" cy="130" r="45" fill="#0D1117" stroke="#00F0FF" stroke-width="2">
    <animate attributeName="r" values="42;47;42" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Core Node Circle & Text -->
  <circle cx="200" cy="130" r="35" fill="#161B22" />
  <text x="200" y="136" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#00F0FF" text-anchor="middle">L-01</text>
  <text x="200" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C9D1D9" text-anchor="middle">Growth &amp; Search</text>

  <!-- ========================================== -->
  <!-- LAB 02 NODE (Right Side)                   -->
  <!-- ========================================== -->
  
  <!-- Outer Rotating Dashed Ring (Reverse Spin) -->
  <circle cx="600" cy="130" r="55" fill="none" stroke="#A3DA00" stroke-width="3" stroke-dasharray="15 25" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="360 600 130" to="0 600 130" dur="6s" repeatCount="indefinite" />
  </circle>
  
  <!-- Inner Pulsing Ring (Offset Timing) -->
  <circle cx="600" cy="130" r="45" fill="#0D1117" stroke="#A3DA00" stroke-width="2">
     <animate attributeName="r" values="47;42;47" dur="2s" repeatCount="indefinite" />
  </circle>
  
  <!-- Core Node Circle & Text -->
  <circle cx="600" cy="130" r="35" fill="#161B22" />
  <text x="600" y="136" font-family="Courier New, monospace" font-size="18" font-weight="bold" fill="#A3DA00" text-anchor="middle">L-02</text>
  <text x="600" y="215" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#C9D1D9" text-anchor="middle">Adv. Dictionaries</text>

</svg>
